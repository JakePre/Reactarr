<!DOCTYPE html>
<html>
<head>
  <title>Reactarr</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body { padding-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mb-4">Reactarr</h1>

    <div class="card mb-4">
      <div class="card-body">
        <h2 class="card-title">Create a New Rule</h2>
        <div class="form-row">
          <div class="form-group col-md-2">
            <label for="media-type">If Media Is</label>
            <select id="media-type" class="form-control">
              <option value="episode">Episode</option>
              <option value="movie">Movie</option>
            </select>
          </div>
          <div class="form-group col-md-2">
            <label for="event-type">And Event Is</label>
            <select id="event-type" class="form-control">
              <option value="downloaded">Downloaded</option>
              <option value="imported">Imported</option>
              <option value="grabbed">Grabbed</option>
              <option value="failed">Failed</option>
            </select>
          </div>
          <div class="form-group col-md-3">
            <label for="status">And Status Is</label>
            <select id="status" class="form-control">
              <option value="waiting_for_import">Waiting for Import</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <div class="form-group col-md-2">
            <label for="quality-profile">And Quality Is</label>
            <select id="quality-profile" class="form-control">
              <option value="">Any</option>
            </select>
          </div>
          <div class="form-group col-md-2">
            <label for="tag">And Tag Is</label>
            <select id="tag" class="form-control">
              <option value="">Any</option>
            </select>
          </div>
          <div class="form-group col-md-2">
            <label for="action">Then Action Is</label>
            <select id="action" class="form-control">
              <option value="delete">Delete</option>
              <option value="notify">Notify</option>
            </select>
          </div>
          <div class="form-group col-md-3 align-self-end">
            <button class="btn btn-primary btn-block" onclick="addRule()">Add Rule</button>
            <button class="btn btn-secondary btn-block mt-2" onclick="previewRule()">Preview Rule</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card mb-4" id="preview-card" style="display: none;">
      <div class="card-body">
        <h2 class="card-title">Rule Preview</h2>
        <ul id="preview-results" class="list-group"></ul>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <h2 class="card-title">Existing Rules</h2>
        <ul id="rules" class="list-group"></ul>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
