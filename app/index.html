<!DOCTYPE html>
<html>
<head>
  <title>Reactarr</title>
  <style>
    body { font-family: sans-serif; }
    .rule-builder, .rules-list { margin-bottom: 20px; }
    select, button { padding: 5px; }
  </style>
</head>
<body>
  <h1>Reactarr</h1>

  <div class="rule-builder">
    <h2>Create a New Rule</h2>
    <p>If
      <select id="media-type">
        <option value="episode">Episode</option>
        <option value="movie">Movie</option>
      </select>
      is
      <select id="event-type">
        <option value="downloaded">Downloaded</option>
        <option value="imported">Imported</option>
      </select>
      and status is
      <select id="status">
        <option value="waiting_for_import">Waiting for Import</option>
        <option value="completed">Completed</option>
      </select>
      then
      <select id="action">
        <option value="delete">Delete</option>
        <option value="notify">Notify</option>
      </select>
    </p>
    <button onclick="addRule()">Add Rule</button>
  </div>

  <div class="rules-list">
    <h2>Existing Rules</h2>
    <ul id="rules"></ul>
  </div>

  <script>
    const mediaTypeEl = document.getElementById('media-type');
    const eventTypeEl = document.getElementById('event-type');
    const statusEl = document.getElementById('status');
    const actionEl = document.getElementById('action');
    const rulesListEl = document.getElementById('rules');

    async function addRule() {
      const rule = {
        mediaType: mediaTypeEl.value,
        eventType: eventTypeEl.value,
        status: statusEl.value,
        action: actionEl.value,
      };

      await fetch('/api/rules', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(rule),
      });

      fetchRules();
    }

    async function fetchRules() {
      const response = await fetch('/api/rules');
      const data = await response.json();

      rulesListEl.innerHTML = '';
      if (data.rules.length === 0) {
        rulesListEl.innerHTML = '<li>No rules yet.</li>';
        return;
      }

      for (const rule of data.rules) {
        const li = document.createElement('li');
        li.textContent = `If ${rule.mediaType} is ${rule.eventType} and status is ${rule.status} then ${rule.action}`;

        const deleteButton = document.createElement('button');
        deleteButton.textContent = 'Delete';
        deleteButton.onclick = () => deleteRule(rule.id);

        li.appendChild(deleteButton);
        rulesListEl.appendChild(li);
      }
    }

    async function deleteRule(ruleId) {
      await fetch(`/api/rules/${ruleId}`, { method: 'DELETE' });
      fetchRules();
    }

    // Fetch rules when the page loads
    fetchRules();
  </script>
</body>
</html>
